<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,100..900,0..100,0..1;1,9..144,100..900,0..100,0..1&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            color-scheme: light;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Fraunces", serif;
            background:
                radial-gradient(circle at top left, rgba(92, 92, 92, 0.12), transparent 36%),
                radial-gradient(circle at bottom right, rgba(92, 92, 92, 0.08), transparent 28%),
                #f3efe7;
            color: #111;
            display: grid;
            place-items: center;
            padding: 24px;
        }

        .panel {
            width: min(720px, 100%);
            border: 1px solid rgba(92, 92, 92, 0.35);
            background: rgba(255, 255, 255, 0.86);
            backdrop-filter: blur(8px);
            box-shadow: 0 18px 60px rgba(0, 0, 0, 0.08);
            padding: 28px;
        }

        .eyebrow {
            margin: 0 0 8px;
            font-size: 0.9rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0 0 14px;
            font-size: clamp(2.2rem, 5vw, 4rem);
            line-height: 0.95;
        }

        p {
            margin: 0 0 18px;
            max-width: 58ch;
            font-size: 1.05rem;
            line-height: 1.6;
        }

        form {
            display: grid;
            gap: 16px;
            margin-top: 18px;
        }

        label {
            display: grid;
            gap: 8px;
            font-size: 0.95rem;
            font-weight: 600;
        }

        input[type="password"],
        input[type="file"] {
            width: 100%;
            font: inherit;
            background: #fff;
            border: 1px solid rgba(92, 92, 92, 0.4);
            padding: 14px;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }

        button {
            appearance: none;
            border: 1px solid #111;
            background: #111;
            color: #fff;
            font: inherit;
            font-weight: 700;
            padding: 14px 18px;
            cursor: pointer;
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        .status {
            min-height: 1.5em;
            font-size: 0.98rem;
        }

        .links {
            margin-top: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            font-size: 0.95rem;
        }

        a {
            color: inherit;
            text-decoration: none;
            border-bottom: 1px solid currentColor;
        }
    </style>
</head>

<body>
    <main class="panel">
        <p class="eyebrow">Protected upload</p>
        <h1>Replace the live CV</h1>
        <p>
            Upload a new PDF here and the site will publish it at the existing <a href="/cv" target="_blank">/cv</a> link.
            You need both the admin password and your Netlify personal access token.
        </p>

        <form id="upload-form">
            <label>
                Admin password
                <input id="cv-upload-password" name="cv-upload-password" type="password" autocomplete="current-password" placeholder="CV upload password">
            </label>
            <label>
                Netlify PAT
                <input id="netlify-pat" name="netlify-pat" type="password" autocomplete="off" placeholder="Netlify personal access token">
            </label>
            <label>
                New CV PDF
                <input id="file" type="file" accept="application/pdf,.pdf" required>
            </label>
            <div class="actions">
                <button id="submit" type="submit">Publish new CV</button>
                <span class="status" id="status" aria-live="polite"></span>
            </div>
        </form>

        <div class="links">
            <a href="/">Back to site</a>
            <a href="/cv" target="_blank">Open current CV</a>
        </div>
    </main>

    <script>
        const form = document.getElementById("upload-form");
        const passwordInput = document.getElementById("cv-upload-password");
        const patInput = document.getElementById("netlify-pat");
        const fileInput = document.getElementById("file");
        const status = document.getElementById("status");
        const submitButton = document.getElementById("submit");

        function setStatus(message, isError = false) {
            status.textContent = message;
            status.style.color = isError ? "#8f1d1d" : "#111";
        }

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const password = passwordInput.value.trim();
            const pat = patInput.value.trim();
            const file = fileInput.files[0];

            if (!password) {
                setStatus("Enter the admin password first.", true);
                return;
            }

            if (!pat) {
                setStatus("Enter the Netlify PAT first.", true);
                return;
            }

            if (!file) {
                setStatus("Choose a PDF to upload.", true);
                return;
            }

            submitButton.disabled = true;
            setStatus("Publishing new CV...");

            try {
                const response = await fetch("/.netlify/functions/upload-cv", {
                    method: "POST",
                    headers: {
                        "X-CV-Upload-Password": password,
                        "X-Netlify-Token": pat,
                        "Content-Type": file.type || "application/pdf",
                        "X-Filename": file.name,
                    },
                    body: file,
                });

                const payload = await response.json();

                if (!response.ok) {
                    throw new Error(payload.error || "Upload failed.");
                }

                setStatus(`Published successfully. Deploy ${payload.deployId} is ${payload.state}.`);
            } catch (error) {
                setStatus(error.message || "Upload failed.", true);
            } finally {
                submitButton.disabled = false;
            }
        });
    </script>
</body>

</html>
