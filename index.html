<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Granth Jain</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,100..900,0..100,0..1;1,9..144,100..900,0..100,0..1&display=swap"
        rel="stylesheet">
    <link rel="icon" type="image/png" href="./gicon.png">
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
        }

        body {
            font-family: "Fraunces", serif;
            font-optical-sizing: auto;
            font-style: normal;
            font-variation-settings: "SOFT" 0, "WONK" 0;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100dvh;
            background-color: white;
        }

        a {
            text-decoration: none;
            color: black;
        }

        .card {
            width: 90dvw;
            height: 90dvh;
            background-color: white;
            padding: 20px 24px;
            border: 1px solid #5c5c5c;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .top-bar {
            font-size: clamp(1rem, 1.6vw, 1.5rem);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .hero {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            flex: 1;
            text-align: center;
            gap: 12px;
            padding: 24px 0;
        }

        .hero-title {
            font-size: clamp(1.75rem, 3vw, 3rem);
            line-height: 1.1;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 0.35em;
        }

        .hero-title .name {
            font-weight: 700;
        }

        .hero-details {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 8px;
            font-size: clamp(1rem, 1.8vw, 1.5rem);
            gap: 0.35em;
        }

        .separator {
            opacity: 0.8;
        }

        .contact-links {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 16px 20px;
            font-size: clamp(0.95rem, 1.4vw, 1.5rem);
        }

        .ext-link {
            display: inline-flex;
            align-items: center;
            white-space: nowrap;
        }

        .ext-link img {
            width: 1.5em;
            height: 1.5em;
            vertical-align: middle;
            margin-right: 8px;
        }

        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .card {
                width: 100%;
                height: calc(100dvh - 20px);
                padding: 18px 16px;
                gap: 20px;
            }

            .top-bar {
                flex-direction: column;
                align-items: flex-start;
                font-size: 1rem;
                gap: 6px;
            }

            .hero {
                padding: 8px 0 12px;
                gap: 10px;
            }

            .hero-title {
                font-size: clamp(1.45rem, 7vw, 2.3rem);
                flex-direction: column;
                gap: 0.15em;
            }

            .hero-details {
                flex-direction: column;
                gap: 0.15em;
                font-size: 1rem;
            }

            .separator {
                display: none;
            }

            .contact-links {
                justify-content: flex-start;
                gap: 10px 12px;
            }

            .ext-link {
                width: 100%;
            }

            .ext-link img {
                width: 1.25em;
                height: 1.25em;
                margin-right: 8px;
            }
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="top-bar">
            <a href="mailto:jain@granth.one">jain@granth.one</a>
            <a href="https://www.granth.one">granth.one</a>
        </div>

        <main class="hero">
            <div class="hero-title">
                <span class="name">Granth Jain</span>
                <span class="separator">•</span>
                <span class="role">Software Engineer</span>
            </div>

            <div class="hero-details">
                <span>London, UK</span>
                <span class="separator">•</span>
                <span>Elan Capital</span>
            </div>
        </main>

        <nav class="contact-links" aria-label="Contact links">
            <a href="https://github.com/cat-loaf/" class="ext-link" target="_blank">
                <img src="./square-github-brands-solid.png" alt="GitHub"> cat-loaf
            </a>
            <a href="https://www.linkedin.com/in/granth-jain/" class="ext-link" target="_blank">
                <img src="./linkedin-brands-solid.png" alt="LinkedIn"> granth-jain
            </a>
            <a href="mailto:jain@granth.one" class="ext-link" target="_blank">
                <img src="./square-envelope-solid.png" alt="Email"> jain@granth.one
            </a>
            <a href="/cv" class="ext-link" target="_blank">
                <img src="./resume.png" alt="Resume"> Resume
            </a>
        </nav>
    </div>
</body>

</html>
